name: CI

# CLAUDE.md's enforcement note: "Anything that MUST happen (tests before 'done')
# belongs in a pre-commit / PreToolUse hook or CI, not only here." This is the CI
# half. It deliberately runs on a plain GitHub runner with no GPU, no Isaac Sim
# and no ROS 2 — that is the point. The Brain half of this project (orchestrator,
# perception interfaces, transport/base, kpi, schema's pure contract) is required
# to import and test without them, and a runner that cannot possibly have Isaac
# is the only honest way to prove it stays that way.
#
# Isaac-bound code (`world/`, `transport/sim_native.py`) is NOT exercised here and
# cannot be — it needs `./python.sh` on the Spark. Those paths are covered by the
# pxr-guarded tests, which SKIP here by design.

on:
  pull_request:
  # Every branch, not just `main`. Gating only at PR time left work on a
  # long-lived feature branch unverified for as long as nobody opened one — which
  # is the same shape as the "no PR to main for four sessions" problem this repo
  # already had. The suite runs in ~6 s, so the extra minutes are not the
  # constraint; `concurrency` below cancels superseded runs.
  push:

# A superseded run on the same branch is wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Isaac-free tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is pyproject's requires-python. The upper end guards against
        # deprecations landing before the Spark's bundled Python moves.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pure-python deps only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert the runner really is Isaac-free
        # If Isaac ever became importable here, every "runs without Isaac" claim
        # below would silently stop being a claim about anything.
        run: |
          python - <<'PY'
          import importlib.util as u
          leaked = [m for m in ("omni", "isaacsim", "pxr", "carb") if u.find_spec(m)]
          if leaked:
              raise SystemExit(f"Isaac modules present on the runner: {leaked}")
          print("runner is Isaac-free")
          PY

      - name: pytest
        # -rs surfaces the skip reasons in the log, so a test that starts
        # skipping for a new reason is visible instead of blending into a count.
        run: pytest tests/ -q -rs

  no-direct-push-to-main:
    # CLAUDE.md: "Do not push to main; branch + PR." CI cannot *prevent* a push —
    # only a branch-protection rule can, and that has to be set on the repo. This
    # job makes an unreviewed direct push loudly red instead of invisible, and is
    # a placeholder until protection is enabled on `main`.
    name: Direct push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail unless this commit arrived via a merge
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::HEAD on main is not a merge commit — looks like a direct push."
            echo "Branch and open a PR instead (CLAUDE.md). Enable branch protection on main to block this at the source."
            exit 1
          fi
          echo "main advanced by a merge commit, as expected."
