[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-twin"
version = "0.1.0"
description = "Autonomous solar-farm inspection digital twin (Slice 0 spine)"
requires-python = ">=3.10"
# Pure-python deps only. Isaac Sim, pxr/usd, and ROS 2 are provided by the
# Isaac Sim bundled Python at runtime and are intentionally NOT listed here —
# the Brain half must import and test without them (see CLAUDE.md golden rules).
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `numpy` and `imageio` are deliberately NOT runtime deps: the modules that use
# them (`perception/base.py`, `world/recorder.py`) import them inside function
# bodies so the ABCs stay importable on a bare interpreter. The test suite does
# need them at module level, though, so they belong here — without numpy,
# test_dem/test_tour/test_wfm_evaluator/test_recorder fail to collect rather
# than skipping, which would silently shrink the suite on a clean runner.
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
    "imageio[ffmpeg]>=2.31",
    # `energy/model.py` imports pvlib inside the solver call, so the package stays
    # importable without it — but the tests must actually RUN, not skip. A suite that
    # silently shrinks on a clean runner is how two blade-shadow tests passed locally
    # and failed CI on 2026-08-03; `test_energy.py` uses importorskip, so without this
    # line CI would report green while testing nothing.
    "pvlib>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
